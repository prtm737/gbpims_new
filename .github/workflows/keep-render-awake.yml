name: Keep Supabase Alive

# Pings the Cloudflare Worker keep-alive endpoint every 5 min so the Supabase
# free project never idles into pause (free tier pauses after ~7 days inactive).
# The live app itself runs on Cloudflare Workers (always-on, no sleep) — the old
# Render target is retired, so the ping now hits the worker instead.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cloudflare Worker keep-alive
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://gbp.gbpims.workers.dev/api/public/keepalive || echo "000")
          echo "Keep-alive HTTP $code"
          # Warm the auth proxy health endpoint too
          curl -s -o /dev/null -w "Auth health HTTP %{http_code}\n" "https://gbp.gbpims.workers.dev/api/public/auth-proxy?path=/auth/v1/health" || true
