name: Deploy to Firebase (asia-south1)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Client bundle reads these via import.meta.env at build time;
          # without them authClient throws "Authentication is not configured."
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is not set"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::SUPABASE_PUBLISHABLE_KEY secret is not set"; exit 1; }
          # process.env alone did not embed in CI builds; the known-good local
          # build had these in a .env file, so materialize it before building.
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > .env
          npm run build
          grep -q "$SUPABASE_URL" .output/public/assets/*.js 2>/dev/null || grep -q "$SUPABASE_URL" dist/assets/*.js 2>/dev/null || { echo "::error::client bundle missing Supabase URL - auth pages would crash"; exit 1; }

      - name: Build check only (Render auto-deploys on push)
        run: echo "Build passed — Render will auto-deploy via render.yaml (Singapore, free). No Netlify/Firebase token needed."
