services:
  - type: web
    name: gbpims
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
    healthCheckPath: /
  # Keeps the free web service from sleeping (sleeps after 15 min idle).
  # Runs inside Render's own network — no external account, no GitHub delays.
  - type: cron
    name: keep-gbpims-awake
    runtime: node
    region: singapore
    plan: free
    schedule: "*/14 * * * *"
    startCommand: node -e "fetch('https://gbpims.onrender.com/').then(()=>fetch('https://gbpims.onrender.com/auth')).then(()=>console.log('ping ok')).catch(e=>{console.error(e);process.exit(1)})"
